name: Release

# Push a tag such as v0.2.0 (or v0.2.0-rc.1 for a pre-release) from a commit that is already on main.
# Nothing is published unless every check below passes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: v
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"
          prerelease=false
          [ "$tag" != "$base" ] && prerelease=true
          fail() { echo "::error::$1"; exit 1; }
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-suffix]."
          [ "$(node -p "require('./package.json').version")" = "$base" ] || fail "package.json version differs from $base."
          [ "$(node -p "require('./manifest.json').version")" = "$base" ] || fail "manifest.json version differs from $base."
          grep -q "VERSION = \"$base\"" src/version.ts || fail "src/version.ts differs from $base."
          if [ "$prerelease" = false ]; then
            grep -Eq "^## $base — [0-9]{4}-[0-9]{2}-[0-9]{2}\$" CHANGELOG.md || fail "CHANGELOG.md needs a dated '## $base — YYYY-MM-DD' heading (not 'unreleased')."
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || fail "The tagged commit is not on main."
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security:
    needs: verify
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  build:
    name: Build and attest
    needs: [verify, ci, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets GitHub sign the build provenance with a short-lived identity (no key to store)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mcpb:pack
      - name: Name the bundle, write the SBOM and the checksums
        run: |
          set -euo pipefail
          mkdir release
          mv etoro-mcp-server.mcpb "release/etoro-mcp-server-${{ needs.verify.outputs.version }}.mcpb"
          npm sbom --sbom-format cyclonedx --omit dev > "release/etoro-mcp-server-${{ needs.verify.outputs.version }}.sbom.cdx.json"
          (cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.mcpb
            release/*.sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: release/
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
          fail_on_unmatched_files: true
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            **Verify before installing.** The bundle is not code-signed with a certificate, so Claude Desktop shows an "unsigned extension" notice. Check where it came from instead:

            ```bash
            shasum -a 256 -c SHA256SUMS --ignore-missing
            gh attestation verify etoro-mcp-server-${{ needs.verify.outputs.version }}.mcpb --repo ${{ github.repository }}
            ```

            The second command proves the file was built from this repository by its release workflow. `*.sbom.cdx.json` lists the bundled dependencies (CycloneDX).
